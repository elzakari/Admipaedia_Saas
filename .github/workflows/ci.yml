name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # Shared concurrency group across ci.yml / enhanced-ci-cd.yml / production-build-test.yml
  # on the SAME ref. New push to the same ref cancels any still-running instances,
  # so 3 workflows never starve public runners by stacking 6 parallel runs.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Secret scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-tests:
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci --workspaces=false --legacy-peer-deps --include=dev --no-audit --no-fund
      env:
        CYPRESS_INSTALL_BINARY: 0
    
    - name: Type check
      run: npm run typecheck
      continue-on-error: true
    
    - name: Run linting
      run: npm run lint

    - name: Build
      run: npm run build
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: ${{ hashFiles('frontend/coverage/**') != '' }}
      with:
        directory: ./frontend/coverage

  backend-tests:
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: pytest
      continue-on-error: true
      env:
        FLASK_ENV: testing
        TEST_DB_URL: "sqlite:///:memory:"
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: ${{ hashFiles('backend/coverage/**') != '' }}
      with:
        directory: ./backend/coverage
