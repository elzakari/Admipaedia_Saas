name: production-build-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # Shared concurrency group across ci.yml / enhanced-ci-cd.yml / production-build-test.yml
  # on the SAME ref. New push to the same ref cancels any still-running instances,
  # so 3 workflows never starve public runners by stacking 6 parallel runs.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: |
          echo "Current node: $(node --version) / npm: $(npm --version)"
          MAJOR=$(node --version | sed 's/^v//' | cut -d. -f1)
          if [ "$MAJOR" -ge 22 ]; then
            echo "Node 22+ detected: keeping bundled npm (npm 10+ required, npm 9 incompatible)"
            npm install -g npm@10.9.2 || true
          else
            npm install -g npm@9.9.4
          fi
          npm --version

      - name: Install dependencies (clean)
        run: |
          npm --version
          node --version
          npm ci --workspaces=false --legacy-peer-deps --include=dev --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod frontend

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend
