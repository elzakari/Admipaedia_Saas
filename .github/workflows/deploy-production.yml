name: Deploy ADMIPAEDIA Production


# ============================================================
# TRIGGERS
# ============================================================
#
# Automatic deployment:
#   Runs whenever application/code changes are pushed or merged
#   into the main branch.
#
# Manual deployment:
#   Actions -> Deploy ADMIPAEDIA Production -> Run workflow
#
# Documentation-only changes and changes to this deployment
# workflow itself do not trigger an automatic production deploy.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/deploy-production.yml"

  workflow_dispatch:


# ============================================================
# WORKFLOW PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# DEPLOYMENT CONCURRENCY
# ============================================================
#
# Do not intentionally run multiple production deployments
# simultaneously.
#
# The production server also has its own kernel-backed flock
# protection inside update-app.sh.

concurrency:
  group: admipaedia-production
  cancel-in-progress: false


# ============================================================
# PRODUCTION DEPLOYMENT JOB
# ============================================================

jobs:

  deploy:

    name: Deploy to sms-prod

    runs-on: ubuntu-latest

    timeout-minutes: 45


    steps:

      # ======================================================
      # DEPLOYMENT INFORMATION
      # ======================================================

      - name: Deployment information
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " ADMIPAEDIA PRODUCTION DEPLOYMENT"
          echo "============================================================"
          echo
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Commit     : $GITHUB_SHA"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Actor      : $GITHUB_ACTOR"
          echo


      # ======================================================
      # CONNECT GITHUB RUNNER TO TAILSCALE
      # ======================================================
      #
      # The GitHub-hosted runner temporarily joins the tailnet.
      #
      # OAuth credential:
      #   TS_OAUTH_CLIENT_ID
      #   TS_OAUTH_SECRET
      #
      # Runner tag:
      #   tag:admipaedia-ci
      #
      # Tailscale destination:
      #   sms-prod
      #   100.100.205.84
      #
      # Expected network access:
      #   TCP/22 only

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4

        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:admipaedia-ci
          ping: 100.100.205.84


      # ======================================================
      # CONFIGURE RESTRICTED PRODUCTION SSH
      # ======================================================
      #
      # PROD_SSH_KEY is the restricted GitHub deployment key.
      #
      # It is NOT the normal sms-prod administrator key.
      #
      # Server-side authorized_keys forces this key through:
      #
      # /opt/admipaedia/scripts/github-auto-deploy.sh
      #
      # Allowed commands:
      #
      #   check
      #   deploy
      #
      # No normal shell or arbitrary commands are permitted.

      - name: Configure production SSH
        shell: bash

        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " CONFIGURING RESTRICTED PRODUCTION SSH"
          echo "============================================================"

          mkdir -p "$HOME/.ssh"

          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_KEY" \
            > "$HOME/.ssh/admipaedia_prod"

          chmod 600 "$HOME/.ssh/admipaedia_prod"

          touch "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo
          echo "Retrieving sms-prod SSH host key..."

          ssh-keyscan \
            -T 10 \
            -H 100.100.205.84 \
            >> "$HOME/.ssh/known_hosts"

          echo
          echo "✅ Production SSH configuration complete."


      # ======================================================
      # PRODUCTION PREFLIGHT
      # ======================================================
      #
      # Restricted SSH command:
      #
      #   check
      #
      # Server-side flow:
      #
      # github-auto-deploy.sh check
      #           ↓
      # update-app.sh --check
      #
      # This checks production readiness without deploying.

      - name: Production preflight
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " PRODUCTION PREFLIGHT"
          echo "============================================================"

          ssh \
            -i "$HOME/.ssh/admipaedia_prod" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            admin@100.100.205.84 \
            check

          echo
          echo "✅ Production preflight passed."


      # ======================================================
      # PRODUCTION DEPLOYMENT
      # ======================================================
      #
      # Restricted SSH command:
      #
      #   deploy
      #
      # Server-side deployment:
      #
      # github-auto-deploy.sh deploy
      #           ↓
      # update-app.sh v4.1
      #           ↓
      # deployment flock
      #           ↓
      # production preflight
      #           ↓
      # PostgreSQL readiness
      #           ↓
      # Redis readiness
      #           ↓
      # GitHub SSH validation
      #           ↓
      # database backup
      #           ↓
      # verified ff-only Git update
      #           ↓
      # Alembic migration
      #           ↓
      # Docker builds
      #           ↓
      # backend/frontend/worker recreation
      #           ↓
      # Socket.IO runtime verification
      #           ↓
      # NPM refresh
      #           ↓
      # public API readiness verification

      - name: Deploy production
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " STARTING ADMIPAEDIA PRODUCTION DEPLOYMENT"
          echo "============================================================"

          ssh \
            -i "$HOME/.ssh/admipaedia_prod" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            admin@100.100.205.84 \
            deploy

          echo
          echo "✅ Server deployment command completed successfully."


      # ======================================================
      # POST-DEPLOYMENT PRODUCTION VERIFICATION
      # ======================================================
      #
      # We intentionally run verification from sms-prod instead
      # of curling the public API directly from GitHub.
      #
      # GitHub-hosted runner IP addresses can receive Cloudflare
      # HTTP 403 responses even when ADMIPAEDIA itself is healthy.
      #
      # The server-side `check` command verifies production from
      # the trusted production environment.

      - name: Post-deployment production verification
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " POST-DEPLOYMENT PRODUCTION VERIFICATION"
          echo "============================================================"

          ssh \
            -i "$HOME/.ssh/admipaedia_prod" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            admin@100.100.205.84 \
            check

          echo
          echo "✅ ADMIPAEDIA post-deployment verification passed."


      # ======================================================
      # SUCCESS SUMMARY
      # ======================================================

      - name: Deployment success
        if: success()

        shell: bash

        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " ✅ ADMIPAEDIA PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"
          echo
          echo "Commit:"
          echo "$GITHUB_SHA"
          echo
          echo "Branch:"
          echo "$GITHUB_REF_NAME"
          echo
          echo "Production:"
          echo "https://admipaedia.easymsdigit.com"
          echo
          echo "GitHub Run ID:"
          echo "$GITHUB_RUN_ID"
          echo


      # ======================================================
      # FAILURE SUMMARY
      # ======================================================

      - name: Deployment failure notice
        if: failure()

        shell: bash

        run: |
          echo "============================================================"
          echo " ❌ ADMIPAEDIA PRODUCTION DEPLOYMENT FAILED"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"
          echo
          echo "Commit:"
          echo "$GITHUB_SHA"
          echo
          echo "Branch:"
          echo "$GITHUB_REF_NAME"
          echo
          echo "GitHub Run ID:"
          echo "$GITHUB_RUN_ID"
          echo
          echo "Review the failed workflow step above before retrying."
          echo
