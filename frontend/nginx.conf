events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Dedicated long-lived connection pool for the Socket.IO backend worker.
    # Without keepalive, every polling XHR opens a fresh TCP handshake to
    # backend-socket:5001 which increases latency and can exhaust ephemeral
    # ports during a reconnect cascade (the exact failure mode we saw in prod).
    upstream socket_backend {
        server backend-socket:5001;
        keepalive 64;
        keepalive_requests 10000;
        keepalive_timeout 3600s;
    }

    # Upstream pool for the 4-worker API pool so API handshakes also reuse TCP.
    upstream api_backend {
        server backend:5000;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    server {
        listen 80;
        server_name admipaedia.easymsdigit.com;
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Service Worker
        location /enhanced-sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            error_page 404 =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Drop requests for missing assets/locales/manifest to a clean 404
        location ^~ /assets/ {
            try_files $uri =404;
            error_page 404 =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /locales/ {
            try_files $uri =404;
            error_page 404 =404;
        }

        location = /manifest.json {
            try_files $uri =404;
            error_page 404 =404;
        }

        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Reuse upstream keepalive pool; disable buffering for streaming downloads.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /socket.io/ {
            # The dedicated single-worker backend-socket container owns all
            # Socket.IO connections.  Do NOT route /socket.io to the generic
            # backend-api 4-worker pool because Engine.IO sid state is stored
            # in-process and cannot be shared between workers.
            proxy_pass http://socket_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Critical: upstream pool keepalive requires these two lines.
            proxy_set_header Connection "";
            # Long-lived connections need longer timeouts; sticky sessions
            # are also required here (single backend-socket instance today
            # implicitly provides stickiness).
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            # Buffering must be off for streaming transports.
            proxy_buffering off;
            proxy_cache off;
            # Nginx must not drop the client body on POST polls.
            client_max_body_size 1m;
            # Dont pass close hop-by-hop.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Offline fallback
        location /offline.html {
            internal;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /offline.html;
    }
}
